AWSTemplateFormatVersion: "2010-09-09"
Description: MedicalManager Blazor app on ECS Fargate with encrypted Amazon RDS PostgreSQL.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
  ImageUri:
    Type: String
    Description: ECR image URI including tag
  DbUsername:
    Type: String
    Default: medical
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
  PhiKey:
    Type: String
    NoEcho: true
    MinLength: 16
  EmailSmtpPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Gmail App Password for medmgr.us@gmail.com (optional until email is enabled)
  TwilioAccountSid:
    Type: String
    Default: ""
    Description: Optional Twilio account SID for appointment reminder calls and texts
  TwilioAuthToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Twilio auth token
  TwilioFromNumber:
    Type: String
    Default: ""
    Description: Optional Twilio phone number in E.164 format, such as +15551234567
  DbName:
    Type: String
    Default: medicalmanager

Conditions:
  HasTwilio: !Not [!Equals [!Ref TwilioAccountSid, ""]]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS to MedicalManager ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: medicalmanager-alb-sg

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tasks only accept traffic from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: medicalmanager-app-sg

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from the app tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: medicalmanager-db-sg

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MedicalManager RDS subnets
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: medicalmanager-db
      DBName: !Ref DbName
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "07:00-08:00"
      PreferredMaintenanceWindow: "sun:08:00-sun:09:00"
      DeletionProtection: false
      EnableIAMDatabaseAuthentication: false
      AutoMinorVersionUpgrade: true

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: medicalmanager/runtime
      Description: Database URL and PHI encryption key for MedicalManager
      SecretString: !Sub '{"connection":"Host=${DbInstance.Endpoint.Address};Port=5432;Database=${DbName};Username=${DbUsername};Password=${DbPassword};SSL Mode=Require;Trust Server Certificate=true;Maximum Pool Size=50;Timeout=15;Command Timeout=30","phiKey":"${PhiKey}","emailSmtpPassword":"${EmailSmtpPassword}"}'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/medicalmanager
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAppSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: medicalmanager
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: medicalmanager-app
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: ASPNETCORE_ENVIRONMENT
              Value: Production
            - Name: ASPNETCORE_URLS
              Value: http://+:8080
            - Name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              Value: "true"
            - Name: MEDICALMANAGER_DATA_DIR
              Value: /data
            - Name: Email__FromAddress
              Value: medmgr.us@gmail.com
            - Name: Email__Smtp__User
              Value: medmgr.us@gmail.com
            - !If
              - HasTwilio
              - Name: Notifications__Twilio__AccountSid
                Value: !Ref TwilioAccountSid
              - !Ref AWS::NoValue
            - !If
              - HasTwilio
              - Name: Notifications__Twilio__AuthToken
                Value: !Ref TwilioAuthToken
              - !Ref AWS::NoValue
            - !If
              - HasTwilio
              - Name: Notifications__Twilio__FromNumber
                Value: !Ref TwilioFromNumber
              - !Ref AWS::NoValue
          Secrets:
            - Name: ConnectionStrings__DefaultConnection
              ValueFrom: !Sub "${AppSecret}:connection::"
            - Name: MEDICALMANAGER_PHI_KEY
              ValueFrom: !Sub "${AppSecret}:phiKey::"
            - Name: Email__Smtp__Password
              ValueFrom: !Sub "${AppSecret}:emailSmtpPassword::"
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -fsS http://127.0.0.1:8080/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: medicalmanager-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: medicalmanager-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: www.medicalmgr.com
      SubjectAlternativeNames:
        - medicalmgr.com
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: medicalmgr.com

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: medicalmanager-app
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AppSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApplicationUrl:
    Description: Public HTTP URL for MedicalManager
    Value: !Sub http://${Alb.DNSName}
  ApplicationUrlHttps:
    Description: Public HTTPS URL on the ALB (use https://www.medicalmgr.com after DNS)
    Value: !Sub https://${Alb.DNSName}
  DbEndpoint:
    Description: Private RDS endpoint (reachable only from the app)
    Value: !GetAtt DbInstance.Endpoint.Address
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
